[package]
name = "portfolio_site"
version = "0.1.0"
edition = "2021"

[dependencies]
nail = { path = "/home/alex/Nail" }
axum = "0.7"
dashmap = { version = "6.1.0", features = ["serde"] }
futures = "0.3"
rayon = "1.10.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.5", features = ["fs"] }
urlencoding = "2.1"
